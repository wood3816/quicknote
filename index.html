<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="隨手記" />
  <meta name="format-detection" content="telephone=no" />
  <title>隨手記</title>
  <link rel="manifest" href="manifest.webmanifest?v=1.1.7" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=1.1.7" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="title-row"><h1>隨手記</h1><span id="versionLabel" class="version-label">v1.1.7</span></div>
        <div class="date-line">
          <span id="todayLabel"></span>
          <span id="saveStatus" class="save-status ok" aria-live="polite"><span class="status-check">✓</span><span>及時儲存</span></span>
          <span id="autoNewCountdown" class="countdown-text" aria-live="polite"></span>
        </div>
      </div>
      <div class="header-actions">
        <button id="newNoteBtn" class="icon-btn" type="button" aria-label="新增隨手記" title="新增隨手記">＋</button>
        <button id="dataBtn" class="icon-btn data-icon-btn" type="button" aria-label="資料備份" title="資料備份">⇅</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="切換深色模式" title="切換深色模式">☾</button>
      </div>
    </header>

    <main>
      <section id="notesView" class="view active" aria-label="記錄">
        <div class="editor-wrap">
          <textarea id="noteInput" rows="1" maxlength="5000" placeholder="寫下你的想法…" aria-label="輸入隨手記"></textarea>
          <div class="editor-meta">
            <span id="editHint">輸入後立即儲存</span>
            <span id="charCount">0/5000</span>
          </div>
        </div>

        <div class="section-head">
          <h2 id="listTitle">今天的隨手記</h2>
          <span id="todayCount" class="muted-count">0</span>
        </div>
        <div id="notesList" class="notes-list"></div>
      </section>

      <section id="calendarView" class="view" aria-label="日曆">
        <div class="calendar-head">
          <button id="prevMonthBtn" class="plain-btn" type="button" aria-label="上個月">‹</button>
          <h2 id="monthTitle"></h2>
          <button id="nextMonthBtn" class="plain-btn" type="button" aria-label="下個月">›</button>
        </div>
        <div class="weekdays" aria-hidden="true">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div class="section-head calendar-list-head">
          <h2 id="selectedDateTitle"></h2>
          <span id="selectedDateCount" class="muted-count">0</span>
        </div>
        <div id="calendarNotesList" class="notes-list"></div>
      </section>

      <section id="searchView" class="view" aria-label="搜尋">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="搜尋歷史隨手記" autocomplete="off" />
        </div>
        <div class="section-head">
          <h2>搜尋結果</h2>
          <span id="searchCount" class="muted-count">0</span>
        </div>
        <div id="searchResults" class="notes-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-btn active" data-view="notesView" type="button"><span>▣</span><small>記錄</small></button>
      <button class="nav-btn" data-view="calendarView" type="button"><span>□</span><small>日曆</small></button>
      <button class="nav-btn" data-view="searchView" type="button"><span>⌕</span><small>搜尋</small></button>
    </nav>
  </div>

  <div id="actionSheetBackdrop" class="backdrop hidden"></div>
  <div id="actionSheet" class="action-sheet hidden" role="dialog" aria-modal="true" aria-label="隨手記操作">
    <button id="editAction" type="button">✎ 修改</button>
    <button id="reorderAction" type="button">↕ 移動順序</button>
    <button id="deleteAction" class="danger" type="button">⌫ 刪除</button>
    <button id="cancelAction" class="cancel" type="button">取消</button>
  </div>

  <div id="reorderBackdrop" class="backdrop hidden"></div>
  <div id="reorderPanel" class="reorder-panel hidden" role="dialog" aria-modal="true" aria-label="移動順序">
    <div class="panel-head">
      <button id="reorderCancel" class="text-btn" type="button">取消</button>
      <strong>移動順序</strong>
      <button id="reorderDone" class="text-btn" type="button">完成</button>
    </div>
    <p>用 ↑ ↓ 調整順序；桌機也可直接拖曳。</p>
    <div id="reorderList" class="reorder-list"></div>
  </div>


  <div id="dataBackdrop" class="backdrop hidden"></div>
  <div id="dataPanel" class="data-panel hidden" role="dialog" aria-modal="true" aria-label="資料備份">
    <div class="panel-head">
      <button id="dataClose" class="text-btn" type="button">關閉</button>
      <strong>資料備份</strong>
      <span></span>
    </div>
    <div class="data-panel-body">
      <div class="data-summary">目前共有 <strong id="dataNoteCount">0</strong> 筆隨手記</div>
      <button id="exportDataBtn" class="data-action primary" type="button"><span>⇩</span><span><strong>匯出備份</strong><small>將所有隨手記存成 JSON 備份檔</small></span></button>
      <button id="importDataBtn" class="data-action" type="button"><span>⇧</span><span><strong>匯入備份</strong><small>與現有資料合併，不會先刪除目前紀錄</small></span></button>
      <input id="importDataFile" type="file" accept="application/json,.json" hidden />
      <p class="data-help">匯入時會保留原本的日期、時間與內容；完全相同的紀錄會自動略過。</p>
      <div id="dataMessage" class="data-message" aria-live="polite"></div>
    </div>
  </div>

  <script src="app.js?v=1.1.7"></script>
</body>
</html>
