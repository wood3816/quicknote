<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="隨手記">
  <meta name="format-detection" content="telephone=no">
  <title>隨手記</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="brand-line"><h1>隨手記</h1><span id="versionLabel" class="version-label"></span></div>
      <div class="header-actions" aria-label="主要工具">
        <button id="searchBtn" class="icon-btn" type="button" title="搜尋" aria-label="搜尋">⌕</button>
        <button id="calendarBtn" class="icon-btn" type="button" title="日曆" aria-label="日曆">▦</button>
        <button id="themeBtn" class="icon-btn" type="button" title="切換深色模式" aria-label="切換深色模式">◐</button>
        <button id="settingsBtn" class="icon-btn" type="button" title="設定" aria-label="設定">⋮</button>
      </div>
    </header>

    <main>
      <section class="composer" aria-label="新增隨手記">
        <textarea id="noteInput" rows="1" maxlength="10000" placeholder="輸入你的隨手記…" aria-label="隨手記輸入框"></textarea>
        <div class="composer-footer">
          <div id="saveStatus" class="save-status is-ok" aria-live="polite">✅ 即時儲存</div>
          <div class="timer-tools">
            <span id="countdownText" class="countdown">30秒後建立 30s</span>
            <button id="pauseTimerBtn" class="pause-btn" type="button" aria-pressed="false" title="暫停30秒自動建立">Ⅱ</button>
          </div>
        </div>
      </section>

      <div id="updateBanner" class="update-banner hidden" role="status">
        <span id="updateText">發現新版本</span><button id="updateNowBtn" type="button">立即更新</button>
      </div>
      <div id="filterBar" class="filter-bar hidden"><span id="filterText"></span><button id="clearFilterBtn" type="button">回到全部紀錄</button></div>
      <section id="notesSection" class="notes-section" aria-label="歷史隨手記">
        <div id="notesList"></div>
        <div id="emptyState" class="empty-state"><strong>還沒有隨手記</strong><span>從上方輸入框開始記錄。</span></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="底部導覽">
      <button id="navAll" class="nav-btn active" type="button"><span>▱</span><small>全部</small></button>
      <button id="navCalendar" class="nav-btn" type="button"><span>▦</span><small>日曆</small></button>
      <button id="navSearch" class="nav-btn" type="button"><span>⌕</span><small>搜尋</small></button>
      <button id="navSettings" class="nav-btn" type="button"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="backdrop hidden"></div>

  <section id="searchSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
    <div class="sheet-head"><h2 id="searchTitle">搜尋隨手記</h2><button class="close-sheet icon-btn" type="button" aria-label="關閉">×</button></div>
    <div class="search-row"><input id="searchInput" type="search" placeholder="輸入關鍵字…" autocomplete="off"><button id="searchClearBtn" type="button">清除</button></div>
    <p id="searchCount" class="muted-text">輸入關鍵字開始搜尋</p>
  </section>

  <section id="calendarSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="calendarTitle">
    <div class="sheet-head"><h2 id="calendarTitle">選擇日期</h2><button class="close-sheet icon-btn" type="button" aria-label="關閉">×</button></div>
    <div class="calendar-head"><button id="prevMonthBtn" type="button" aria-label="上個月">‹</button><strong id="calendarMonthLabel"></strong><button id="nextMonthBtn" type="button" aria-label="下個月">›</button></div>
    <div class="weekday-grid"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </section>

  <section id="settingsSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-head"><h2 id="settingsTitle">設定</h2><button class="close-sheet icon-btn" type="button" aria-label="關閉">×</button></div>
    <div class="settings-group">
      <h3>主題模式</h3>
      <label><input type="radio" name="themeMode" value="light"> 淺色模式</label>
      <label><input type="radio" name="themeMode" value="dark"> 深色模式</label>
      <label><input type="radio" name="themeMode" value="system"> 跟隨系統</label>
    </div>
    <div class="settings-group">
      <h3>資料管理</h3>
      <button id="exportBtn" class="settings-action" type="button">匯出備份（JSON）</button>
      <label class="settings-action file-label">匯入備份<input id="importInput" type="file" accept=".json,application/json" hidden></label>
      <button id="checkUpdateBtn" class="settings-action" type="button">檢查版本更新</button>
      <button id="clearAllBtn" class="settings-action danger" type="button">清除全部資料</button>
    </div>
    <div class="settings-group">
      <h3>關於</h3>
      <div class="about-row"><span>版本號</span><strong id="settingsVersion"></strong></div>
      <div class="about-row"><span>儲存方式</span><strong>IndexedDB</strong></div>
      <div class="about-row"><span>離線使用</span><strong>支援</strong></div>
    </div>
  </section>

  <section id="editSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="sheet-head edit-head"><button id="cancelEditBtn" type="button">取消</button><h2 id="editTitle">修改紀錄</h2><button id="finishEditBtn" type="button">完成</button></div>
    <textarea id="editInput" class="edit-input" maxlength="10000" aria-label="修改紀錄內容"></textarea>
    <div id="editMeta" class="edit-meta"></div>
    <button id="deleteEditBtn" class="danger-wide" type="button">刪除這筆紀錄</button>
  </section>

  <div id="menuPopover" class="menu-popover hidden" role="menu">
    <button data-action="edit" type="button">✎ 修改</button>
    <button data-action="copy" type="button">▣ 複製內容</button>
    <button data-action="share" type="button">↗ 分享</button>
    <button data-action="up" type="button">↑ 上移一筆</button>
    <button data-action="down" type="button">↓ 下移一筆</button>
    <button data-action="top" type="button">⇈ 移到最上方</button>
    <button data-action="bottom" type="button">⇊ 移到最下方</button>
    <button data-action="delete" class="danger" type="button">⌫ 刪除</button>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"><span id="toastText"></span><button id="toastUndoBtn" class="hidden" type="button">復原</button></div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
